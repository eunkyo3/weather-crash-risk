name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src

      - name: Test (pytest)
        # tests/ 가 아직 없거나 비어 있으면 "no tests collected"(exit 5)로 통과 처리
        run: pytest || [ $? -eq 5 ]
